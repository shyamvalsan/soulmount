[project]
name = "soulmount-brain"
version = "0.1.0"
description = "soulmount brain: self-owned embodiment stack for a Reachy Mini (API, channels, me-time, studio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "openai>=1.40",
]

# Four entry points, one project (SPEC §6).
[project.scripts]
soulmount-brain = "soulmount_brain.app:main"
soulmount-channels = "soulmount_brain.channels:main"
soulmount-metime = "soulmount_brain.metime:main"
soulmount-studio = "soulmount_brain.studio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulmount_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "upstream: hits the real upstream model provider (needs OPENROUTER_API_KEY); costs a few cents",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "openai>=1.40",
]
