[project]
name = "soulmount-body"
version = "0.1.0"
description = "soulmount body app for Reachy Mini — brain-connected fork of the conversation app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Core deps are light so the app's logic is testable off-robot. The Reachy SDK is
# the `robot` extra, installed into /venvs/apps_venv on the robot (see Makefile deploy).
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# The robot ships reachy_mini 1.6.3 (daemon + apps_venv). Our app only uses the
# ReachyMiniApp contract (present in 1.6.3), so match the installed line — do NOT force
# 1.10 (that would upgrade the SDK out of step with the 1.6.3 daemon). See FACTS §2.1.
robot = [
    "reachy-mini>=1.6",
    "openwakeword>=0.4",   # on-Pi wake-word gate; ONNX inference, no cloud
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

# The daemon discovers apps via this entry-point group (FACTS §2).
[project.entry-points."reachy_mini_apps"]
soulmount = "soulmount_body.app:SoulmountApp"

[project.scripts]
soulmount-body = "soulmount_body.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulmount_body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
